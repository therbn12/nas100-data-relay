name: fetch-data

on:
  workflow_dispatch:        # manual "Run workflow" button (use this for the first backfill)
  schedule:
    - cron: "45 4 * * *"    # daily 04:45 UTC — previous UTC day is complete
    - cron: "0 7 * * *"     # retry pass (incremental, cheap no-op if first run succeeded)

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GDELT series
        run: python fetch_gdelt.py

      - name: Fetch NAS100 prices
        run: python fetch_prices.py

      - name: Commit refreshed data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data refresh $(date -u +%FT%TZ)"
          git push
